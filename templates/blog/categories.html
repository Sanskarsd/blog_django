{% extends 'base.html' %}{% block content %}<section class="page-head wrap"><p class="eyebrow">BROWSE</p><h1>All categories</h1></section><section class="wrap category-grid">{% for c in categories %}<a class="category-box" href="{{ c.get_absolute_url }}"><h2>{{ c.name }}</h2><p>{{ c.description|default:'Stories worth exploring.' }}</p><small>{{ c.post_total }} published {{ c.post_total|pluralize:'story,stories' }}</small></a>{% endfor %}</section>{% endblock %}
