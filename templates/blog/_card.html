<article class="card">{% if post.cover_image %}<img src="{{ post.cover_image.url }}" alt="" loading="lazy">{% else %}<div class="placeholder">✦</div>{% endif %}<div class="card-body"><a class="tag" href="{{ post.category.get_absolute_url }}">{{ post.category }}</a><h3><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h3><p>{{ post.excerpt|truncatechars:110 }}</p><div class="meta">{{ post.author.get_full_name|default:post.author.username }} · {{ post.published_at|date:'M j, Y' }}<br>{{ post.reading_time }} min read · {{ post.views }} views</div></div></article>
